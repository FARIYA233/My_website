
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BookNest+</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-section {
      min-height: 78vh;
      display: grid;
      place-items: center;
      padding: 55px 16px;
      background: linear-gradient(135deg, #f8f6ef, #e8f2e9);
    }
    .auth-card {
      width: min(440px, 100%);
      padding: 36px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .auth-card h1 {
      margin: 10px 0;
      color: var(--green-dark);
      font-size: 34px;
    }
    .auth-intro {
      margin-bottom: 25px;
      font-size: 14px;
    }
    .auth-form {
      display: grid;
      gap: 16px;
    }
    .auth-form label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
    }
    .auth-form input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .auth-form input:focus {
      border-color: var(--green);
    }
    .auth-form .btn {
      width: 100%;
      margin-top: 5px;
    }
    .auth-bottom {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
    }
    .auth-bottom a {
      color: var(--green);
      font-weight: 700;
    }
    .auth-message {
      margin-top: 12px;
      font-size: 13px;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 25px 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="index.html" class="logo">
        <span class="logo-icon">B+</span>
        <span>BookNest<span class="logo-plus">+</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#categories" class="nav-link">Categories</a>
        <a href="books.html" class="nav-link">All Books</a>
      </div>
      <div class="nav-actions">
        <a href="signup.html" class="btn btn-primary">Join Us</a>
      </div>
    </nav>
  </header>

  <main class="auth-section">
    <section class="auth-card">
      <span class="section-kicker">WELCOME BACK</span>
      <h1>Login to BookNest+</h1>
      <p class="auth-intro">Continue your reading journey and discover your next favourite book.</p>

      <form class="auth-form" id="loginForm">
        <label for="email">Email Address
          <input type="email" id="email" name="email"
            placeholder="you@example.com" required autocomplete="email">
        </label>

        <label for="password">Password
          <input type="password" id="password" name="password"
            placeholder="Enter your password" required
            autocomplete="current-password" minlength="6">
        </label>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <p class="auth-message" id="loginMessage" role="status"></p>
      <p class="auth-bottom">New to BookNest+?
        <a href="signup.html">Create an account</a>
      </p>
      <p class="auth-bottom"><a href="index.html">← Back to Home</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© <span id="currentYear"></span> BookNest+. All rights reserved.</p>
      <a href="index.html">Back to Home ↑</a>
    </div>
  </footer>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("loginMessage").textContent =
        "Demo form only. Real login requires a backend or authentication service.";
    });
  </script>
</body>
</html>
